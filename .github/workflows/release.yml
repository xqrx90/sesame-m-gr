name: Build & Release

# 触发方式：
#  1) 发布 Release（打 tag）→ 自动构建 debug 包并作为附件挂到该 Release
#  2) 手动触发 → 构建 debug 包并挂到固定的滚动 Release（tag: debug-latest，标记为 Pre-release）
# 说明：本项目不含原生库，无 ABI 拆分，每次只产出一个全架构 APK。
# 注意：绝不使用 actions/upload-artifact —— Actions 存储配额仅 0.5GB，artifact 累积会锁死 CI。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（形如 1.0.0，手动触发时生效）'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 必须完整克隆：versionCode 由 commit 数推导，浅克隆会退化成 1
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Release tag 形如 v1.0.0 / v1.0.0-mgr，去除前导 v 与 -mgr 后缀作为版本号
      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v${{ inputs.version }}"
          fi
          VERSION="${TAG#v}"
          VERSION="${VERSION%-mgr}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved tag=$TAG version=$VERSION"

      - name: Build debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleNormalDebug \
            -P "version=${{ steps.meta.outputs.VERSION }}"

      # debug 变体由 AGP 用仓库内固定的 keystore/debug.keystore 签名，
      # 因此无需任何 secrets，且各版本签名一致 → 可直接覆盖安装升级。
      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p release-out
          find app/build/outputs/apk -name "*.apk" -print -exec cp {} release-out/ \;
          COUNT=$(find release-out -name "*.apk" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未找到构建产物 APK"
            exit 1
          fi
          ls -la release-out
          cd release-out
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'debug-latest' }}
          name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'Debug 最新构建' }}
          prerelease: ${{ github.event_name != 'release' }}
          draft: false
          append_body: true
          generate_release_notes: false
          files: |
            release-out/*.apk
            release-out/*.sha256
          body: |
            ## 安装说明

            | 项 | 值 |
            |---|---|
            | 包名 | `io.github.xqrx90.sesame.mgr` |
            | 构建类型 | **Debug**（调试签名，可直接安装） |
            | 要求 | Android 8.0（API 26）及以上 |
            | 共存 | 可与 Sesame-M / Sesame-GR 同时安装，配置目录互相隔离 |

            - 本项目为 **Sesame-M × Sesame-GR 功能移植版**，签名固定，后续版本可直接覆盖升级，无需卸载。
            - 配置文件位于 `Android/media/com.eg.android.AlipayGphone/sesame-MGR/`，不会与另两版冲突。
            - 仅供学习研究，请于 24 小时内卸载。
