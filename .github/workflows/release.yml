name: Build & Release

# 触发方式：
#  1) 发布 Release（打 tag，如 v1.0.0）→ 构建 debug 包并挂到该 Release
#  2) 手动触发 → 版本号自动递增 0.0.N（N = 已有最大 debug-v0.0.* 标签 + 1），
#     每次构建生成独立的 tag `debug-v0.0.N` 与独立 Release，
#     **不再覆盖同一个 debug-latest**，Releases 列表里逐版保留、可回退。
# 说明：本项目不含原生库，无 ABI 拆分，每次只产出一个全架构 APK。
# 注意：绝不使用 actions/upload-artifact —— Actions 存储配额仅 0.5GB，artifact 累积会锁死 CI。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，留空=自动递增 0.0.N（也可填 0.0.42 之类强制指定）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 必须完整克隆：versionCode 由 commit 数推导，浅克隆会退化成 1
          fetch-depth: 0
          # 自动版本号要读已有 debug-v0.0.* 标签，确保标签被拉下来
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 版本号解析：
      #  · Release 触发：直接取 tag 名，v1.0.0 / v1.0.0-mgr → 1.0.0，构建序号记 0
      #  · 手动触发且留空：扫描已有 debug-v0.0.* 标签取最大值 +1 → 0.0.1、0.0.2、0.0.3…
      #  · 手动触发且填了值：用填的值（应急手动指定）
      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            VERSION="${VERSION%-mgr}"
            BUILD_NUM="0"
          else
            OVERRIDE="${{ inputs.version }}"
            OVERRIDE="${OVERRIDE#v}"
            OVERRIDE="${OVERRIDE#debug-v}"
            if [ -n "$OVERRIDE" ]; then
              VERSION="$OVERRIDE"
              BUILD_NUM="${VERSION##*.}"
              case "$BUILD_NUM" in
                ''|*[!0-9]*) BUILD_NUM="0" ;;
              esac
            else
              LAST=$(git tag -l 'debug-v0.0.*' | sed 's|^debug-v0\.0\.||' | sort -n | tail -1)
              if [ -z "$LAST" ]; then LAST=0; fi
              BUILD_NUM=$((LAST + 1))
              VERSION="0.0.${BUILD_NUM}"
            fi
            TAG="debug-v${VERSION}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "resolved tag=$TAG version=$VERSION build=$BUILD_NUM"

      # 生成「本次修复了什么」：对比上一个 tag，把提交标题列成清单。
      # 之所以用 git log 而不是手写 changelog：提交信息本来就是按功能写的，
      # 自动汇总既不会漏，也不会忘更新。上一个 tag 缺失（首次构建）时退化为最近提交。
      - name: Collect changes
        id: changes
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          # 重新跑同一次构建时 HEAD 本身已被打标，往前退一个提交
          RERUN=0
          if [ -n "$PREV" ] && [ "$(git rev-parse "$PREV^{commit}")" = "$(git rev-parse HEAD)" ]; then
            RERUN=1
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          fi

          if [ -n "$PREV" ]; then
            COUNT=$(git rev-list --count "${PREV}..HEAD")
            LOG=$(git log -n 40 --no-merges --pretty=format:'- %s' "${PREV}..HEAD")
            HEADLINE="对比上一版本 \`${PREV}\`，共 ${COUNT} 个提交"
          elif [ "$RERUN" = "1" ]; then
            COUNT=0
            LOG=""
            HEADLINE="同一提交的重新构建，无新增提交"
          else
            COUNT=$(git rev-list --count HEAD)
            LOG=$(git log -n 15 --no-merges --pretty=format:'- %s' HEAD)
            HEADLINE="以下为最近提交（仓库共 ${COUNT} 个提交）"
          fi

          if [ -z "$LOG" ]; then
            LOG="- 与上一版本相比没有代码改动，仅重新构建"
          fi

          {
            echo "PREV=$PREV"
            echo "HEADLINE=$HEADLINE"
            echo "CHANGES<<__CHANGES_EOF__"
            echo "$LOG"
            echo "__CHANGES_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "changes since ${PREV:-<无>} : ${COUNT} 个提交"

      - name: Build debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleNormalDebug \
            -P "version=${{ steps.meta.outputs.VERSION }}" \
            -P "buildNumber=${{ steps.meta.outputs.BUILD_NUM }}"

      # debug 变体由 AGP 用仓库内固定的 keystore/debug.keystore 签名，
      # 因此无需任何 secrets，且各版本签名一致 → 可直接覆盖安装升级。
      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p release-out
          find app/build/outputs/apk -name "*.apk" -print -exec cp {} release-out/ \;
          COUNT=$(find release-out -name "*.apk" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未找到构建产物 APK"
            exit 1
          fi
          ls -la release-out
          cd release-out
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('Debug {0}', steps.meta.outputs.VERSION) }}
          prerelease: ${{ github.event_name != 'release' }}
          draft: false
          # 每个版本独立成条：不追加旧正文
          # （debug 包带 prerelease=true，GitHub 不会把它标成 Latest，无需额外 make_latest）
          append_body: false
          generate_release_notes: false
          files: |
            release-out/*.apk
            release-out/*.sha256
          body: |
            ${{ steps.changes.outputs.HEADLINE }}

            ## 本次变更

            ${{ steps.changes.outputs.CHANGES }}

            ## 安装说明

            | 项 | 值 |
            |---|---|
            | 版本 | `${{ steps.meta.outputs.VERSION }}`（构建序号 ${{ steps.meta.outputs.BUILD_NUM }}） |
            | 包名 | `io.github.xqrx90.sesame.mgr` |
            | 构建类型 | **Debug**（调试签名，可直接安装） |
            | 要求 | Android 8.0（API 26）及以上 |
            | 共存 | 可与 Sesame-M / Sesame-GR 同时安装，配置目录互相隔离 |
            | 提交 | [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |

            - 本项目为 **Sesame-M × Sesame-GR 功能移植版**，签名固定，后续版本可直接覆盖升级，无需卸载。
            - 每次构建生成独立版本与本页，历史版本保留可随时回退。
            - 配置文件位于 `Android/media/com.eg.android.AlipayGphone/sesame-MGR/`，不会与另两版冲突。
            - 仅供学习研究，请于 24 小时内卸载。
